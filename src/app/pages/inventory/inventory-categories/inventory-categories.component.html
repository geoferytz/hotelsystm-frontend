<div class="page-header">
  <h3><a routerLink="/home" class="back-arrow"><i class="bi bi-arrow-left"></i></a> Inventory Categories</h3>
  <button class="btn btn-primary btn-split" *ngIf="canCreate()" (click)="openModal()">
    <span class="btn-text">Add Category</span>
    <span class="btn-divider"></span>
    <span class="btn-icon"><i class="bi bi-plus-lg icon-spin"></i></span>
  </button>
</div>

<app-shared-table
  [columns]="categoryColumns"
  [data]="categories"
  [actions]="categoryActions"
  [currentPage]="currentPage"
  [itemsPerPage]="itemsPerPage"
  [totalItems]="categories.length"
  emptyMessage="No categories found"
  (pageChange)="changePage($event)"
  (actionClick)="onCategoryTableAction($event)">
</app-shared-table>

<!-- Add/Edit Modal -->
<div class="modal fade" [class.show]="showModal" [style.display]="showModal ? 'block' : 'none'" tabindex="-1" (click)="$event.stopPropagation()">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header modal-header-animated">
        <h5 class="modal-title"><i class="bi bi-folder-plus me-2"></i>{{ editing ? 'Edit Category' : 'Add Category' }}</h5>
        <button type="button" class="btn-close btn-close-animated" (click)="showModal = false">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label fw-semibold">Category Name</label>
          <input type="text" class="form-control" [(ngModel)]="form.name" placeholder="Enter category name">
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Description</label>
          <textarea class="form-control" [(ngModel)]="form.description" rows="3" placeholder="Enter description (optional)"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="showModal = false">Cancel</button>
        <button class="btn btn-primary" (click)="saveCategory()">{{ editing ? 'Update' : 'Save' }}</button>
      </div>
    </div>
  </div>
</div>

<!-- Confirm Delete Dialog -->
<app-confirm-dialog
  *ngIf="showConfirmDialog"
  [title]="'Delete Category'"
  [message]="'Are you sure you want to delete this category? This action cannot be undone.'"
  (confirm)="onConfirmDelete()"
  (cancel)="onCancelDelete()">
</app-confirm-dialog>
