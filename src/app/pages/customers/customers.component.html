<div class="page-header">
  <h3><a routerLink="/home" class="back-arrow"><i class="bi bi-arrow-left"></i></a> Customers (Guests)</h3>
  <button class="btn btn-primary btn-split" *ngIf="canCreate()" (click)="openModal()">
    <span class="btn-text">Add Customer</span>
    <span class="btn-divider"></span>
    <span class="btn-icon"><i class="bi bi-person-plus icon-spin"></i></span>
  </button>
</div>

<div class="row g-2 mb-3">
  <div class="col-md-4">
    <div class="input-group">
      <span class="input-group-text" style="background: var(--royal-green-pale); color: var(--royal-green);"><i class="bi bi-search"></i></span>
      <input type="text" class="form-control" placeholder="Search by name, phone, email..." [(ngModel)]="searchTerm" (input)="onSearch()">
    </div>
  </div>
</div>

<app-shared-table
  [columns]="customerColumns"
  [data]="customers"
  [actions]="customerActions"
  [currentPage]="currentPage"
  [itemsPerPage]="itemsPerPage"
  [totalItems]="customers.length"
  emptyMessage="No customers found"
  (pageChange)="changePage($event)"
  (actionClick)="onCustomerTableAction($event)">
</app-shared-table>

<!-- Modal -->
<div class="modal fade" [class.show]="showModal" [style.display]="showModal ? 'block' : 'none'" tabindex="-1" (click)="closeModal()">
  <div class="modal-dialog" (click)="$event.stopPropagation()">
    <div class="modal-content">
      <div class="modal-header modal-header-animated">
        <h5 class="modal-title"><i class="bi bi-people me-2"></i>{{ editing ? 'Edit Customer' : 'Add Customer' }}</h5>
        <button type="button" class="btn-close btn-close-animated" (click)="closeModal()">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label fw-semibold">Full Name *</label>
            <input type="text" class="form-control" [(ngModel)]="form.fullName">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Phone *</label>
            <input type="text" class="form-control" [(ngModel)]="form.phone">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" class="form-control" [(ngModel)]="form.email">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">ID Number</label>
            <input type="text" class="form-control" [(ngModel)]="form.idNumber">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Nationality</label>
            <input type="text" class="form-control" [(ngModel)]="form.nationality">
          </div>
          <div class="col-md-6">
            <label class="form-label fw-semibold">Address</label>
            <textarea class="form-control" [(ngModel)]="form.address" rows="2"></textarea>
          </div>
        </div>
        <div class="mb-3 mt-3">
          <label class="form-label fw-semibold">Properties / Belongings</label>
          <textarea class="form-control" [(ngModel)]="form.belongings" rows="3" placeholder="List customer's belongings or properties (e.g. laptop, suitcase, phone...)"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="closeModal()">Cancel</button>
        <button class="btn btn-primary" (click)="saveCustomer()">{{ editing ? 'Update' : 'Create' }}</button>
      </div>
    </div>
  </div>
</div>

<!-- Confirm Dialog -->
<app-confirm-dialog
  [isOpen]="showConfirmDialog"
  title="Delete Customer"
  message="Are you sure you want to delete this customer? This action cannot be undone."
  (confirm)="onConfirmDelete()"
  (cancel)="onCancelDelete()">
</app-confirm-dialog>

<div class="modal-backdrop fade show" *ngIf="showModal"></div>
