<div class="page-header">
  <h3><a routerLink="/home" class="back-arrow"><i class="bi bi-arrow-left"></i></a> Roles &amp; Permissions</h3>
  <button class="btn btn-primary btn-split" (click)="openRoleModal()">
    <span class="btn-text">New Role</span>
    <span class="btn-divider"></span>
    <span class="btn-icon"><i class="bi bi-plus-lg icon-spin"></i></span>
  </button>
</div>

<ng-template #roleNameTemplate let-row>
  {{ row.name }}
  <span *ngIf="getUserCountForRole(row.name) > 0" class="badge bg-secondary ms-1">{{ getUserCountForRole(row.name) }} user(s)</span>
</ng-template>

<!-- Roles Table -->
<div class="card">
  <div class="card-header bg-white fw-semibold">Roles</div>
  <div class="card-body p-0">
    <app-shared-table
      [columns]="roleColumns"
      [data]="roles"
      [actions]="roleActions"
      [currentPage]="currentPage"
      [itemsPerPage]="itemsPerPage"
      [totalItems]="roles.length"
      emptyMessage="No roles defined"
      (pageChange)="changePage($event)"
      (actionClick)="onRoleTableAction($event)">
    </app-shared-table>
  </div>
</div>

<!-- Role Modal -->
<div class="modal fade" [class.show]="showRoleModal" [style.display]="showRoleModal ? 'block' : 'none'" tabindex="-1" (click)="closeModals()">
  <div class="modal-dialog modal-lg" (click)="$event.stopPropagation()">
    <div class="modal-content">
      <div class="modal-header modal-header-animated">
        <h5 class="modal-title"><i class="bi bi-shield-lock me-2"></i>{{ editingRole ? 'Edit Role' : 'New Role' }}</h5>
        <button type="button" class="btn-close btn-close-animated" (click)="closeModals()">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label fw-semibold">Role Name *</label>
          <div class="input-group">
            <input type="text" class="form-control" [(ngModel)]="roleForm.name" (ngModelChange)="onRoleNameChange()" placeholder="e.g., Admin, Manager, Receptionist" list="existingRoles">
            <datalist id="existingRoles">
              <option *ngFor="let roleName of getExistingRoleNames()" [value]="roleName">
                {{ roleName }} ({{ getUserCountForRole(roleName) }} users)
              </option>
            </datalist>
          </div>
          <small class="text-muted" *ngIf="roleForm.name && getUserCountForRole(roleForm.name) > 0">
            This role is assigned to {{ getUserCountForRole(roleForm.name) }} user(s). Changing permissions will affect these users.
          </small>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Description</label>
          <textarea class="form-control" [(ngModel)]="roleForm.description" rows="2" placeholder="Describe this role's responsibilities"></textarea>
        </div>
        <div class="mb-3" *ngIf="editingRole">
          <label class="form-label fw-semibold">Active</label>
          <select class="form-select" [(ngModel)]="roleForm.isActive">
            <option [ngValue]="true">Active</option>
            <option [ngValue]="false">Inactive</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Permissions</label>
          
          <!-- Module Tabs -->
          <div class="module-tabs">
            <button class="module-tab" [class.active]="selectedModule === 'all'" (click)="selectModule('all')">
              <i class="bi bi-grid"></i> All
            </button>
            <button class="module-tab" [class.active]="selectedModule === module.name" *ngFor="let module of modules" (click)="selectModule(module.name)">
              <i class="bi bi-box"></i> {{ module.label }}
            </button>
          </div>

          <!-- Permissions Grid -->
          <div class="permissions-grid">
            <div class="permission-card" *ngFor="let module of getDisplayedModules()">
              <div class="permission-card-header">
                <h6 class="mb-0">
                  <i class="bi bi-box"></i> {{ module.label }}
                  <button class="btn btn-sm btn-link select-all-btn" (click)="toggleAllPermissions(module.name)">
                    {{ isAllSelected(module.name) ? 'Deselect All' : isPartiallySelected(module.name) ? 'Select All' : 'Select All' }}
                  </button>
                </h6>
              </div>
              <div class="permission-card-body">
                <div class="permission-item" *ngFor="let p of getModulePermissions(module.name)">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" [id]="'perm-' + p.id"
                      [checked]="roleForm.permissionIds.includes(p.id)"
                      (click)="togglePermission(p.id); $event.stopPropagation()">
                    <label class="form-check-label" [for]="'perm-' + p.id" (click)="togglePermission(p.id)">
                      <span class="perm-action">{{ p.action }}</span>
                      <span class="perm-desc">{{ p.description }}</span>
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="closeModals()">Cancel</button>
        <button class="btn btn-primary" (click)="saveRole()">{{ editingRole ? 'Update' : 'Create' }}</button>
      </div>
    </div>
  </div>
</div>

<!-- Confirm Dialog -->
<app-confirm-dialog
  [isOpen]="showConfirmDialog"
  title="Delete Role"
  message="Are you sure you want to delete this role? This action cannot be undone."
  (confirm)="onConfirmDelete()"
  (cancel)="onCancelDelete()">
</app-confirm-dialog>

<div class="modal-backdrop fade show" *ngIf="showRoleModal"></div>
