<div class="page-header">
  <h3><a routerLink="/home" class="back-arrow"><i class="bi bi-arrow-left"></i></a> Workers</h3>
  <button class="btn btn-primary btn-split" (click)="openModal()">
    <span class="btn-text">Register Worker</span>
    <span class="btn-divider"></span>
    <span class="btn-icon"><i class="bi bi-plus-lg icon-spin"></i></span>
  </button>
</div>

<div class="row g-2 mb-3">
  <div class="col-md-3">
    <input type="text" class="form-control" placeholder="Search workers..." [(ngModel)]="searchTerm" (input)="onSearch()">
  </div>
  <div class="col-md-2">
    <select class="form-select" [(ngModel)]="filterStatus" (change)="loadWorkers()">
      <option value="">All Statuses</option>
      <option value="active">Active</option>
      <option value="on-leave">On Leave</option>
      <option value="terminated">Terminated</option>
    </select>
  </div>
  <div class="col-md-2">
    <select class="form-select" [(ngModel)]="filterDept" (change)="loadWorkers()">
      <option value="">All Departments</option>
      <option value="Front Desk">Front Desk</option>
      <option value="Housekeeping">Housekeeping</option>
      <option value="Kitchen">Kitchen</option>
      <option value="Maintenance">Maintenance</option>
      <option value="Security">Security</option>
      <option value="Management">Management</option>
    </select>
  </div>
</div>

<app-shared-table
  [columns]="workerColumns"
  [data]="workers"
  [actions]="workerActions"
  [currentPage]="currentPage"
  [itemsPerPage]="itemsPerPage"
  [totalItems]="workers.length"
  emptyMessage="No workers found"
  (pageChange)="changePage($event)"
  (actionClick)="onWorkerTableAction($event)">
</app-shared-table>

<!-- Modal -->
<div class="modal fade" [class.show]="showModal" [style.display]="showModal ? 'block' : 'none'" tabindex="-1" (click)="closeModal()">
  <div class="modal-dialog modal-lg" (click)="$event.stopPropagation()">
    <div class="modal-content">
      <div class="modal-header modal-header-animated">
        <h5 class="modal-title"><i class="bi bi-person-badge me-2"></i>{{ editing ? 'Edit Worker' : 'Register Worker' }}</h5>
        <button type="button" class="btn-close btn-close-animated" (click)="closeModal()">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Full Name *</label>
            <input type="text" class="form-control" [(ngModel)]="form.fullName">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Email *</label>
            <input type="email" class="form-control" [(ngModel)]="form.email">
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Phone</label>
            <input type="text" class="form-control" [(ngModel)]="form.phone">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">ID Number</label>
            <input type="text" class="form-control" [(ngModel)]="form.idNumber">
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Department *</label>
            <select class="form-select" [(ngModel)]="form.department">
              <option value="">Select...</option>
              <option value="Front Desk">Front Desk</option>
              <option value="Housekeeping">Housekeeping</option>
              <option value="Kitchen">Kitchen</option>
              <option value="Maintenance">Maintenance</option>
              <option value="Security">Security</option>
              <option value="Management">Management</option>
            </select>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Position *</label>
            <input type="text" class="form-control" [(ngModel)]="form.position">
          </div>
        </div>
        <div class="row">
          <div class="col-md-4 mb-3">
            <label class="form-label fw-semibold">Hire Date *</label>
            <input type="date" class="form-control" [(ngModel)]="form.hireDate">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label fw-semibold">Salary</label>
            <input type="number" class="form-control" [(ngModel)]="form.salary" step="0.01">
          </div>
          <div class="col-md-4 mb-3" *ngIf="editing">
            <label class="form-label fw-semibold">Status</label>
            <select class="form-select" [(ngModel)]="form.status">
              <option value="active">Active</option>
              <option value="on-leave">On Leave</option>
              <option value="terminated">Terminated</option>
            </select>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Address</label>
          <textarea class="form-control" [(ngModel)]="form.address" rows="2"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Emergency Contact</label>
          <input type="text" class="form-control" [(ngModel)]="form.emergencyContact">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="closeModal()">Cancel</button>
        <button class="btn btn-primary" (click)="saveWorker()">{{ editing ? 'Update' : 'Register' }}</button>
      </div>
    </div>
  </div>
</div>
<div class="modal-backdrop fade show" *ngIf="showModal"></div>
