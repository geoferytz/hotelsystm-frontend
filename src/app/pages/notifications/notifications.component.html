<div class="page-header">
  <h3><i class="bi bi-bell"></i> Notifications</h3>
  <button class="btn btn-outline-primary" (click)="markAllRead()" *ngIf="unreadCount > 0">
    <i class="bi bi-check-all"></i> Mark All Read
  </button>
</div>

<div class="list-group">
  <div class="list-group-item list-group-item-action d-flex align-items-start"
    *ngFor="let n of notifications"
    [class.list-group-item-light]="n.isRead"
    [class.unread]="!n.isRead"
    (click)="markRead(n)">
    <div class="notif-icon me-3">
      <i class="bi" [ngClass]="getIcon(n.type)"></i>
    </div>
    <div class="flex-grow-1">
      <div class="d-flex justify-content-between">
        <h6 class="mb-1 fw-semibold">{{ n.title }}</h6>
        <small class="text-muted">{{ n.createdAt | date:'short' }}</small>
      </div>
      <p class="mb-1 small">{{ n.message }}</p>
      <span class="badge" [ngClass]="'badge-' + n.type">{{ n.type }}</span>
    </div>
  </div>
  <div *ngIf="notifications.length === 0" class="text-center text-muted py-5">
    <i class="bi bi-bell-slash" style="font-size: 2rem;"></i>
    <p class="mt-2">No notifications yet</p>
  </div>
</div>
