<div class="change-password-page">
  <div class="page-header">
    <h3><i class="bi bi-shield-lock me-2"></i>Change Password</h3>
  </div>

  <div class="password-card">
    <div *ngIf="success" class="alert alert-success alert-dismissible fade show" role="alert">
      <i class="bi bi-check-circle me-2"></i>Password changed successfully!
      <button type="button" class="btn-close" (click)="success = false"></button>
    </div>

    <div *ngIf="error" class="alert alert-danger alert-dismissible fade show" role="alert">
      <i class="bi bi-exclamation-triangle me-2"></i>{{ error }}
      <button type="button" class="btn-close" (click)="error = ''"></button>
    </div>

    <form (ngSubmit)="changePassword()">
      <div class="mb-3">
        <label class="form-label">Current Password</label>
        <input type="password" class="form-control" [(ngModel)]="form.currentPassword" name="currentPassword" required>
      </div>
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" class="form-control" [(ngModel)]="form.newPassword" name="newPassword" required minlength="6">
        <small class="text-muted">Password must be at least 6 characters long.</small>
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm New Password</label>
        <input type="password" class="form-control" [(ngModel)]="form.confirmPassword" name="confirmPassword" required minlength="6">
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="loading">
          <i class="bi bi-shield-check me-2" *ngIf="!loading"></i>
          <i class="bi bi-arrow-repeat me-2 spin" *ngIf="loading"></i>
          {{ loading ? 'Changing...' : 'Change Password' }}
        </button>
        <button type="button" class="btn btn-secondary" (click)="cancel()" [disabled]="loading">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
