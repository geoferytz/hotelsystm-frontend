<div class="page-header">
  <h3><a routerLink="/home" class="back-arrow"><i class="bi bi-arrow-left"></i></a> Rooms Management</h3>
  <button class="btn btn-primary btn-split" *ngIf="canCreate()" (click)="openModal()">
    <span class="btn-text">Add Room</span>
    <span class="btn-divider"></span>
    <span class="btn-icon"><i class="bi bi-door-open icon-spin"></i></span>
  </button>
</div>

<!-- Filters -->
<div class="row g-2 mb-3">
  <div class="col-md-3">
    <select class="form-select" [(ngModel)]="filterStatus" (change)="loadRooms()">
      <option value="">All Statuses</option>
      <option value="available">Available</option>
      <option value="occupied">Occupied</option>
      <option value="maintenance">Maintenance</option>
      <option value="dirty">Dirty</option>
    </select>
  </div>
</div>

<app-shared-table
  [columns]="roomColumns"
  [data]="rooms"
  [actions]="roomActions"
  [currentPage]="currentPage"
  [itemsPerPage]="itemsPerPage"
  [totalItems]="rooms.length"
  emptyMessage="No rooms found"
  (pageChange)="changePage($event)"
  (actionClick)="onRoomTableAction($event)">
</app-shared-table>

<!-- Modal -->
<div class="modal fade" [class.show]="showModal" [style.display]="showModal ? 'block' : 'none'" tabindex="-1" (click)="closeModal()">
  <div class="modal-dialog" (click)="$event.stopPropagation()">
    <div class="modal-content">
      <div class="modal-header modal-header-animated">
        <h5 class="modal-title"><i class="bi bi-door-open me-2"></i>{{ editing ? 'Edit Room' : 'Add Room' }}</h5>
        <button type="button" class="btn-close btn-close-animated" (click)="closeModal()">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="row" *ngIf="!editing">
          <div class="col-md-8 mb-3">
            <label class="form-label fw-semibold">{{ numberOfRooms > 1 ? 'Start Room Number' : 'Room Number' }}</label>
            <input type="text" class="form-control" [(ngModel)]="form.roomNumber" placeholder="e.g. 101 or A101">
          </div>
          <div class="col-md-4 mb-3">
            <label class="form-label fw-semibold">Number of Rooms</label>
            <input type="number" class="form-control" [(ngModel)]="numberOfRooms" min="1" max="50">
          </div>
        </div>
        <div class="mb-3" *ngIf="editing">
          <label class="form-label fw-semibold">Room Number</label>
          <input type="text" class="form-control" [(ngModel)]="form.roomNumber">
        </div>
        <!-- Preview of room numbers when creating multiple -->
        <div class="room-numbers-preview" *ngIf="!editing && previewRoomNumbers.length > 1">
          <small class="text-muted fw-semibold">Rooms to be created:</small>
          <div class="preview-tags">
            <span class="preview-tag" *ngFor="let rn of previewRoomNumbers">{{ rn }}</span>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Type</label>
          <select class="form-select" [(ngModel)]="form.type">
            <option *ngFor="let rt of roomTypes" [value]="rt.name.toLowerCase()">{{ rt.name }}</option>
          </select>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Floor</label>
            <input type="number" class="form-control" [(ngModel)]="form.floor">
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label fw-semibold">Price / Night</label>
            <input type="number" class="form-control" [(ngModel)]="form.price">
          </div>
        </div>
        <div class="mb-3" *ngIf="editing">
          <label class="form-label fw-semibold">Status</label>
          <select class="form-select" [(ngModel)]="form.status">
            <option value="available">Available</option>
            <option value="occupied">Occupied</option>
            <option value="maintenance">Maintenance</option>
            <option value="dirty">Dirty</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Description</label>
          <textarea class="form-control" [(ngModel)]="form.description" rows="2"></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Room Images</label>
          <div *ngFor="let img of imageUrls; let i = index" class="room-image-upload mb-2">
            <div class="d-flex gap-2 align-items-center">
              <input type="file" class="form-control" accept="image/*" (change)="onImageSelected($event, i)">
              <button type="button" class="btn btn-sm btn-outline-danger px-2" (click)="removeImageUrl(i)" *ngIf="imageUrls.length > 1" title="Remove">
                <i class="bi bi-x-lg"></i>
              </button>
            </div>
            <div class="room-image-preview mt-2" *ngIf="img.url">
              <img [src]="resolveImageUrl(img.url)" alt="Room image preview">
            </div>
          </div>
          <button type="button" class="btn btn-sm btn-outline-secondary mt-1" (click)="addImageUrl()">
            <i class="bi bi-plus-lg"></i> Add Another Image
          </button>
          <small class="text-muted d-block mt-1">First uploaded image is the main/cover image.</small>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" (click)="closeModal()">Cancel</button>
        <button class="btn btn-primary" (click)="saveRoom()" [disabled]="uploadingImages">
          <span *ngIf="uploadingImages" class="spinner-border spinner-border-sm me-2"></span>
          {{ uploadingImages ? 'Uploading...' : (editing ? 'Update' : 'Create') }}
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Confirm Dialog -->
<app-confirm-dialog
  [isOpen]="showConfirmDialog"
  title="Delete Room"
  message="Are you sure you want to delete this room? This action cannot be undone."
  (confirm)="onConfirmDelete()"
  (cancel)="onCancelDelete()">
</app-confirm-dialog>

<div class="modal-backdrop fade show" *ngIf="showModal"></div>
