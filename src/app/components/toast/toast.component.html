<div class="toast-container">
  <div *ngFor="let t of toasts" class="toast-item" [ngClass]="'toast-' + t.type" [@slideIn]>
    <div class="toast-icon">
      <i class="bi" [ngClass]="getIcon(t.type)"></i>
    </div>
    <div class="toast-content">
      <div class="toast-title">{{ t.title }}</div>
      <div class="toast-message" *ngIf="t.message">{{ t.message }}</div>
    </div>
    <button class="toast-close" (click)="remove(t.id)">
      <i class="bi bi-x-lg"></i>
    </button>
    <div class="toast-progress" [ngClass]="'progress-' + t.type">
      <div class="toast-progress-bar" [style.animation-duration]="t.duration + 'ms'"></div>
    </div>
  </div>
</div>
