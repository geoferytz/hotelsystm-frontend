<form class="shared-form" (ngSubmit)="submit()" novalidate>
  <h5 *ngIf="title" class="shared-form-title">{{ title }}</h5>

  <input *ngFor="let field of hiddenFields()" type="hidden" [(ngModel)]="formModel[field.key]" [name]="field.key">

  <div [class.row]="layout === 'grid'" [class.g-3]="layout === 'grid'" [class.stacked-layout]="layout === 'stacked'">
    <div *ngFor="let field of visibleFields()" [ngClass]="layout === 'grid' ? (field.colClass || 'col-md-6') : 'form-field'">
      <div class="mb-3" [class.form-check]="field.type === 'checkbox'">
        <ng-container [ngSwitch]="field.type">
          <ng-container *ngSwitchCase="'checkbox'">
            <input class="form-check-input" type="checkbox" [(ngModel)]="formModel[field.key]" [name]="field.key" [id]="field.key" [disabled]="field.disabled || loading" (ngModelChange)="onFieldChange(field)">
            <label class="form-check-label" [for]="field.key">{{ field.label }}</label>
          </ng-container>

          <ng-container *ngSwitchCase="'radio'">
            <label class="form-label">{{ field.label }} <span *ngIf="field.required" class="text-danger">*</span></label>
            <div class="radio-group">
              <label class="form-check" *ngFor="let option of field.options || []">
                <input class="form-check-input" type="radio" [(ngModel)]="formModel[field.key]" [name]="field.key" [value]="optionValue(option)" [disabled]="field.disabled || loading" (ngModelChange)="onFieldChange(field)">
                <span class="form-check-label">{{ option.label }}</span>
              </label>
            </div>
          </ng-container>

          <ng-container *ngSwitchCase="'textarea'">
            <label class="form-label" [for]="field.key">{{ field.label }} <span *ngIf="field.required" class="text-danger">*</span></label>
            <textarea class="form-control" [class.is-invalid]="isInvalid(field)" [(ngModel)]="formModel[field.key]" [name]="field.key" [id]="field.key" [placeholder]="field.placeholder || ''" [rows]="field.rows || 3" [required]="field.required || false" [disabled]="field.disabled || loading" [readonly]="field.readonly || false" (ngModelChange)="onFieldChange(field)"></textarea>
          </ng-container>

          <ng-container *ngSwitchCase="'select'">
            <label class="form-label" [for]="field.key">{{ field.label }} <span *ngIf="field.required" class="text-danger">*</span></label>
            <select class="form-select" [class.is-invalid]="isInvalid(field)" [(ngModel)]="formModel[field.key]" [name]="field.key" [id]="field.key" [required]="field.required || false" [disabled]="field.disabled || loading" (ngModelChange)="onFieldChange(field)">
              <option value="">{{ field.placeholder || 'Select' }}</option>
              <option *ngFor="let option of field.options || []" [ngValue]="optionValue(option)">{{ option.label }}</option>
            </select>
          </ng-container>

          <ng-container *ngSwitchCase="'file'">
            <label class="form-label" [for]="field.key">{{ field.label }} <span *ngIf="field.required" class="text-danger">*</span></label>
            <input class="form-control" [class.is-invalid]="isInvalid(field)" type="file" [name]="field.key" [id]="field.key" [accept]="field.accept || ''" [multiple]="field.multiple || false" [required]="field.required || false" [disabled]="field.disabled || loading" (change)="onFileSelected(field, $event)">
          </ng-container>

          <ng-container *ngSwitchDefault>
            <label class="form-label" [for]="field.key">{{ field.label }} <span *ngIf="field.required" class="text-danger">*</span></label>
            <input class="form-control" [class.is-invalid]="isInvalid(field)" [type]="field.type || 'text'" [(ngModel)]="formModel[field.key]" [name]="field.key" [id]="field.key" [placeholder]="field.placeholder || ''" [required]="field.required || false" [disabled]="field.disabled || loading" [readonly]="field.readonly || false" [min]="field.min ?? null" [max]="field.max ?? null" [step]="field.step ?? null" (ngModelChange)="onFieldChange(field)">
          </ng-container>
        </ng-container>

        <div class="invalid-feedback" *ngIf="isInvalid(field)">{{ field.label }} is required.</div>
        <small class="form-text text-muted" *ngIf="field.helpText">{{ field.helpText }}</small>
      </div>
    </div>
  </div>

  <div class="shared-form-actions">
    <button *ngIf="showCancel" type="button" class="btn btn-secondary" (click)="cancel()" [disabled]="loading">{{ cancelLabel }}</button>
    <button type="submit" class="btn btn-primary" [disabled]="loading">
      <span *ngIf="loading" class="spinner-border spinner-border-sm me-1" role="status"></span>
      {{ submitLabel }}
    </button>
  </div>
</form>
