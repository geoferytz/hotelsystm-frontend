server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS - lazima iwe hapa kwa variable proxy_pass.
    # valid=10s: backend ikibadilisha IP (recreate), nginx inapata IP mpya haraka.
    resolver 127.0.0.11 valid=10s;

    client_max_body_size 10m;

    # Variable inamfanya nginx a-resolve hostname wakati wa request, si startup.
    # Manufaa: nginx inaanza hata backend ikiwa down kwa muda, na 'nginx -t'
    # inapita popote (hakuna host resolution wakati wa config test).
    location /api/ {
        set $backend "http://hotel-backend:8080";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        set $backend "http://hotel-backend:8080";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
